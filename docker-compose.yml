services:
  postgres:
    image: postgres:17-alpine
    container_name: store-checkout-postgres
    environment:
      POSTGRES_USER: store_checkout
      POSTGRES_PASSWORD: store_checkout
      POSTGRES_DB: store_checkout
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U store_checkout -d store_checkout"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 300s

volumes:
  postgres_data:
