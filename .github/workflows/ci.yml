name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  changes:
    name: Detect apps/packages changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Paths filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'package.json'
              - 'eslint.config.mjs'
              - 'vitest.config.ts'
            packages:
              - 'packages/**'

  lint-and-test:
    name: Lint and Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve comparison ref and scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}"
          else
            BASE="origin/${{ github.ref_name }}"
            git fetch origin "${{ github.ref_name }}"
          fi
          echo "ref=${BASE}" >> "$GITHUB_OUTPUT"
          if git diff --name-only "${BASE}...HEAD" | grep -qE '^(pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|package\.json|eslint\.config\.|vitest\.config\.)'; then
            echo "full_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "full_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and test affected packages
        run: |
          if [ "${{ steps.scope.outputs.full_run }}" = "true" ]; then
            pnpm turbo run lint test
          else
            pnpm turbo run lint test --filter=...[${{ steps.scope.outputs.ref }}]
          fi

  em-slice-drift:
    name: EM slice drift check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check slice drift
        run: pnpm em:slice:check-drift --all
        continue-on-error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, lint-and-test]
    if: |
      always() &&
      needs.changes.outputs.code == 'true' &&
      (needs.lint-and-test.result == 'success' || needs.lint-and-test.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve comparison ref and scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}"
          else
            BASE="origin/${{ github.ref_name }}"
            git fetch origin "${{ github.ref_name }}"
          fi
          echo "ref=${BASE}" >> "$GITHUB_OUTPUT"
          if git diff --name-only "${BASE}...HEAD" | grep -qE '^(pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|package\.json|eslint\.config\.|vitest\.config\.)'; then
            echo "full_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "full_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build affected packages
        run: |
          if [ "${{ steps.scope.outputs.full_run }}" = "true" ]; then
            pnpm turbo run build
          else
            pnpm turbo run build --filter=...[${{ steps.scope.outputs.ref }}]
          fi
